name: Validate ForeverExport pull requests

on:
  pull_request:
    paths:
      - '*.lua'
      - '*.toc'
      - 'tests/*.lua'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Validate addon manifest and Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            case "$source" in
              *.lua)
                test -f "$source"
                luac5.1 -p "$source"
                ;;
            esac
          done < <(tr -d '\r' < ForeverExport.toc)
          for test in tests/*.lua; do luac5.1 -p "$test"; done
      - name: Run mocked game API tests
        run: |
          lua5.1 tests/export_spec.lua
          lua5.1 tests/bank_deposit_spec.lua
